name: Standalone chest tracker

on:
  pull_request:
    paths:
      - 'chest-tracker/**'
      - 'vendor/parser/**'
      - '.github/workflows/chest-tracker.yml'
  push:
    branches:
      - 'feature/standalone-chest-tracker'
    paths:
      - 'chest-tracker/**'
      - 'vendor/parser/**'
      - '.github/workflows/chest-tracker.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test replay selection
        run: node --test chest-tracker/*.test.js
      - name: Build single-player parser
        run: dotnet build chest-tracker/chest-tracker.csproj -c Release
